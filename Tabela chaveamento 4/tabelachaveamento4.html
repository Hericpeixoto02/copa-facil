<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaveamento Oitavas de Final - 16 Equipes</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #304DED; font-family: Arial, sans-serif; min-height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; overflow: auto; }
        .scale-fit { width: 1200px; display: flex; flex-direction: column; padding: 40px 0; }
        .header { color: #fff; display: flex; justify-content: center; align-items: center; height: 15vh; }
        ul.textos-cabeçalho { display: flex; gap: 124px; list-style: none; font-size: 14px; font-weight: bold; }
        .bracket-wrapper { display: flex; justify-content: center; align-items: center; flex-grow: 1; gap: 55px; margin-top: -25px; width: 100%; }
        .container-equipes { display: flex; justify-content: center; align-items: stretch; height: 100%; }
        img { border-radius:15px; width: 20px !important; }
        .box-equipes2 { display: flex; flex-direction: column; justify-content: space-around; gap: 154px; height: 100%; }
        .box-equipes3 { display: flex; flex-direction: column; justify-content: space-around; gap: 397px; height: 100%; }
        
        .center-bracket { font-family: Arial, sans-serif; color: white; display: flex; flex-direction: column; align-items: center; width: 320px; margin: 0 20px; }
        .bracket-header { text-align: center; margin-bottom: 30px; }
        .year-outline { font-size: 64px; margin: 0; color: transparent; -webkit-text-stroke: 1px rgba(255, 255, 255, 0.5); letter-spacing: 2px; }
        .schedule-title { font-size: 16px; margin: -10px 0 0 0; font-weight: 800; letter-spacing: 1px; }
        .stage-label { font-size: 11px; font-weight: bold; text-align: center; margin-bottom: 8px; text-transform: uppercase; }
        .bracket-stage { display: flex; flex-direction: column; align-items: center; position: relative; margin-bottom: 30px; }
        
        .box { background-color: white; border-radius: 6px; height: 28px; width: 158px; }
        .match-card { position: relative; display: flex; flex-direction: column; gap: 4px; width: 163px; }
        .team-row { height: 28px; border-radius: 6px; display: flex; overflow: hidden; }
        .split-row { width: 160px; margin: 0 auto; margin-bottom: 8px; margin-top: 8px; }
        .seed { background-color: #242c9c; color: white; font-size: 9px; font-weight: bold; display: flex; align-items: center; justify-content: center; width: 35px; }
        .name { background-color: white; flex-grow: 1; display: flex; align-items: center; color: #000; }
        
        .vs-badge { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 10px; font-weight: bold; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2; }

        .semifinals-container { display: flex; gap: 20px; position: relative; margin-top: 10px; }
        
        .name strong { font-size: 11px; margin-left: 5px; }
        span.name img { margin-left: 5px;  }
        p.jogo { color: #fff; font-size: 10px; font-weight: 700; text-align: center; margin-bottom: -7px; min-height: 12px; }

        /* TRAÇOS DO CHAVEAMENTO */
        .container-equipes:nth-child(1) .match-card:nth-child(odd)::after, .container-equipes:nth-child(2) .match-card:nth-child(odd)::after { content: ''; position: absolute; top: 50%; right: -27.5px; width: 27.5px; border-top: 2px solid white; border-right: 2px solid white; }
        .container-equipes:nth-child(1) .match-card:nth-child(even)::after, .container-equipes:nth-child(2) .match-card:nth-child(even)::after { content: ''; position: absolute; bottom: 50%; right: -27.5px; width: 27.5px; border-bottom: 2px solid white; border-right: 2px solid white; }
        .container-equipes:nth-child(1) .match-card::after { height: 129px; } .container-equipes:nth-child(2) .match-card::after { height: 248.5px; }
        .container-equipes:nth-child(2) .match-card::before, .semifinals-container .bracket-stage:nth-child(1) .match-card::before { content: ''; position: absolute; top: 50%; left: -27.5px; width: 27.5px; border-top: 2px solid white; }

        .container-equipes:nth-child(5) .match-card:nth-child(odd)::before, .container-equipes:nth-child(4) .match-card:nth-child(odd)::before { content: ''; position: absolute; top: 50%; left: -27.5px; width: 27.5px; border-top: 2px solid white; border-left: 2px solid white; }
        .container-equipes:nth-child(5) .match-card:nth-child(even)::before, .container-equipes:nth-child(4) .match-card:nth-child(even)::before { content: ''; position: absolute; bottom: 50%; left: -27.5px; width: 27.5px; border-bottom: 2px solid white; border-left: 2px solid white; }

        .bracket-stage.final-stage::before { content: ''; position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%); width: 183px; height: 15px; border-top: 2px solid white; border-left: 2px solid white; border-right: 2px solid white; }

    <script>
        function preencherFase(fase, dados) {
            if(!dados) return;
            
            dados.forEach((jogo, i) => {
                const elLabel = document.getElementById(`label-${fase}-${i}`);

                const elNome1 = document.getElementById(`nome-${fase}-${i}-t1`);
                const elImg1 = document.getElementById(`img-${fase}-${i}-t1`);
                const elPlacar1 = document.getElementById(`placar-${fase}-${i}-t1`);
                
                const elNome2 = document.getElementById(`nome-${fase}-${i}-t2`);
                const elImg2 = document.getElementById(`img-${fase}-${i}-t2`);
                const elPlacar2 = document.getElementById(`placar-${fase}-${i}-t2`);

                if(elLabel && jogo.label) elLabel.innerText = jogo.label;

                if(elNome1 && jogo["name1:"]) elNome1.innerText = jogo["name1:"];
                if(elImg1 && jogo.url1) { elImg1.src = jogo.url1; elImg1.style.display = "inline-block"; }
                if(elPlacar1 && jogo.r1 !== undefined) elPlacar1.innerText = jogo.r1;

                if(elNome2 && jogo["name2:"]) elNome2.innerText = jogo["name2:"];
                if(elImg2 && jogo.url2) { elImg2.src = jogo.url2; elImg2.style.display = "inline-block"; }
                if(elPlacar2 && jogo.r2 !== undefined) elPlacar2.innerText = jogo.r2;
            });
        }

        function definirCampeao(jogoFinal) {
            if(!jogoFinal) return;

            const placar1 = parseInt(jogoFinal.r1) || 0;
            const placar2 = parseInt(jogoFinal.r2) || 0;
            
            const elNomeCampeao = document.getElementById('nome-campeao');
            const elImgCampeao = document.getElementById('img-campeao');

            if(elNomeCampeao && elImgCampeao) {
                if (placar1 > placar2) {
                    elNomeCampeao.innerText = jogoFinal["name1:"];
                    elImgCampeao.src = jogoFinal.url1;
                    elImgCampeao.style.display = "inline-block";
                } else if (placar2 > placar1) {
                    elNomeCampeao.innerText = jogoFinal["name2:"];
                    elImgCampeao.src = jogoFinal.url2;
                    elImgCampeao.style.display = "inline-block";
                } else {
                    elNomeCampeao.innerText = "EMPATE"; 
                }
            }
        }

        // AGORA LENDO O ARQUIVO "16_equipes.json"
        fetch('16_equipes.json') 
            .then(resposta => {
                if (!resposta.ok) throw new Error("Erro ao carregar o arquivo JSON.");
                return resposta.json();
            })
            .then(dadosTorneio => {
                // A estrutura do seu "16_equipes.json" para Oitavas até a Final
                preencherFase('oitavas', dadosTorneio[0]); // 8 Jogos
                preencherFase('quartas', dadosTorneio[1]); // 4 Jogos
                preencherFase('semis', dadosTorneio[2]);   // 2 Jogos
                preencherFase('final', dadosTorneio[3]);   // 1 Jogo

                // Preencher o campeão baseando-se no placar do jogo da final (índice 3)
                if(dadosTorneio[3] && dadosTorneio[3].length > 0) {
                    definirCampeao(dadosTorneio[3][0]);
                }
                
                // Se houver um índice [4] no JSON futuro para a disputa do 3º lugar
                if(dadosTorneio[4]) {
                    preencherFase('terceiro', dadosTorneio[4]);
                }
            })
            .catch(erro => {
                console.error("Erro no Chaveamento:", erro);
                alert("Atenção: Verifique se o arquivo '16_equipes.json' está na mesma pasta do HTML e se a página está rodando num Servidor Local (Live Server).");
            });
    </script>
