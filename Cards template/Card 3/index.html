<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado - Fim de Jogo</title>
    
    <link rel="stylesheet" href="style-feed.css">
</head>
<body>
    <div class="card">
        <div class="footer-texture"></div>
        
        <img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccerball.svg" class="ball" alt="Bola de Futebol">

        <div class="content">
            <div class="header">
                <span class="date-time">10.07.2024 | 07 HORAS</span>
            </div>

            <div class="titles">
                <h1>FIM DE JOGO!</h1>
                <h2>RESULTADO FINAL</h2>
            </div>

            <div class="score-container">
                <span class="score-number">2</span>
                <span class="score-x">X</span>
                <span class="score-number">2</span>
            </div>

            <div class="teams-container">
                <div class="team">
                    <span class="team-name">BORCELE</span>
                    <div class="shield green-shield"></div>
                </div>
                <div class="team">
                    <span class="team-name">FAUSTINO</span>
                    <div class="shield black-shield"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
