<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado Fim de Jogo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-resultado">
        
        <div class="date-badge">
            10.07.2024 | 07 HORAS
        </div>

        <div class="header-titles">
            <h1 class="efeito-textura">FIM DE JOGO!</h1>
            <h2>RESULTADO FINAL</h2>
        </div>

        <div class="scoreboard">
            <div class="team">
                <div class="score-number efeito-textura">2</div>
                <div class="team-name">BORCELE</div>
                <div class="shield-border">
                    <div class="shield-inner green-stripes"></div>
                </div>
            </div>

            <div class="vs efeito-textura">X</div>

            <div class="team">
                <div class="score-number efeito-textura">2</div>
                <div class="team-name">FAUSTINO</div>
                <div class="shield-border">
                    <div class="shield-inner black-stripes"></div>
                </div>
            </div>
        </div>

        <div class="footer-elements">
            <div class="dark-ground"></div>
            <img src="img/dirtysoccerballc4dmodel001-removebg-preview.png" alt="Bola de Futebol" class="soccer-ball">
        </div>

    </div>

</body>
</html>
