<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card jogo 4</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-torcida">
        
        <!-- Fundos (Estádio e Relvado) -->
        <div class="bg-top"></div>
        <div class="bg-bottom"></div>

        <!-- Setas Pontilhadas (Canto Superior Esquerdo) -->
        <div class="dots-group top-left">
            <div class="dot-chevron"></div>
            <div class="dot-chevron"></div>
            <div class="dot-chevron"></div>
            <div class="dot-chevron"></div>
        </div>

        <!-- Setas Pontilhadas (Canto Inferior Direito) -->
        <div class="dots-group bottom-right">
            <div class="dot-chevron"></div>
            <div class="dot-chevron"></div>
            <div class="dot-chevron"></div>
            <div class="dot-chevron"></div>
        </div>

        <div class="content">
            
            <p class="subtitle">VENHA TORCER!</p>

            <div class="main-title">
                <h2 class="efeito-rasgao cor-amarela">HOJE TEM</h2>
                <h1 class="efeito-rasgao cor-branca sombra-forte">JOGO</h1>
            </div>

            <!-- BOLA E REDE -->
            <!-- Quando tiver a sua imagem da bola com a rede, coloque o link no src abaixo -->
            <img src="img/4cfe25e2d987ca58c97f7587390e0b40-removebg-preview.png" alt="Sua Bola com Rede aqui" class="soccer-ball">

            <!-- CAIXAS DAS EQUIPAS -->
            <div class="matchup-container">
                <div class="team-pill">
                    CLUBE<br>FAUSTINO
                </div>
                
                <div class="vs-circle">
                    <span class="efeito-rasgao cor-branca">X</span>
                </div>
                
                <div class="team-pill">
                    CLUBE<br>BORCELLE
                </div>
            </div>

            <div class="footer-info">
                <h3 class="time efeito-rasgao cor-branca">ÀS 20H</h3>
                <div class="location-box">NO CLUBE FAUSTINO</div>
            </div>

        </div>
    </div>

</body>
</html>
