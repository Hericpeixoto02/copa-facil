<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Venha Torcer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-torcida">
        
        <div class="bg-top"></div>
        <div class="bg-bottom"></div>

        <div class="dots dot-arrow-tl"></div>
        <div class="dots dot-arrow-br"></div>

        <div class="content">
            
            <p class="subtitle">VENHA TORCER!</p>

            <div class="main-title">
                <h2>HOJE TEM</h2>
                <h1>JOGO</h1>
            </div>

            <img src="https://cdn-icons-png.flaticon.com/512/53/53283.png" alt="Bola na rede" class="soccer-ball">

            <div class="matchup-container">
                <div class="team-pill">
                    CLUBE<br>FAUSTINO
                </div>
                
                <div class="vs-circle">X</div>
                
                <div class="team-pill">
                    CLUBE<br>BORCELLE
                </div>
            </div>

            <div class="footer-info">
                <h3 class="time">ÀS 20H</h3>
                <div class="location-box">NO CLUBE FAUSTINO</div>
            </div>

        </div>
    </div>

</body>
</html>
