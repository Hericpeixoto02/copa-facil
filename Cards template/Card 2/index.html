<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card de Jogo 2</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,800;0,900;1,900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-red">
        <div class="striped-bar top-bar"></div>

        <img src="img/pngtree-soccer-ball-vector-png-image_9194292.png" alt="Bola" class="floating-ball ball-right">
        <img src="img/pngtree-soccer-ball-vector-png-image_9194292.png" alt="Bola" class="floating-ball ball-left">

        <div class="content-wrapper">
            <div class="header">
                <h2>HOJE TEM</h2>
                <div class="jogo-title">
                    <h1>JOGO</h1>
                    
                </div>
            </div>

            <div class="action-photo-wrapper">
                <div class="action-photo">
                    <div class="photo-bg"></div>
                </div>
            </div>

            <div class="game-info">
                <p class="time">ÀS 19H</p>
                <div class="stage-badge">SEMI-FINAL</div>
            </div>

            <div class="matchup">
                <div class="team">
                    <img src="img/Santos_Logo.png" alt="Borcelle" class="team-logo">
                    <p>BORCELLE</p>
                </div>
                <div class="vs">X</div>
                <div class="team">
                    <img src="img/pngtree-football-team-logo-vector-png-image_17561239.png" alt="Faustino" class="team-logo">
                    <p>FAUSTINO</p>
                </div>
            </div>

            <div class="footer">
                <p>RUA ALEGRE, 123 - CIDADE BRASILEIRA</p>
            </div>
        </div>

        <div class="striped-bar bottom-bar"></div>
    </div>

</body>
</html>
